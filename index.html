<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>얼굴 인식 및 좌표 표시</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.6rem; }
    .stage {
      position: relative;
      width: min(900px, 100%);
      margin: 18px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #status { color: #d1d5db; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      margin: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    #start { background: #22c55e; color: #052e16; }
    #stop { background: #374151; color: white; }
    .note { color: #9ca3af; font-size: .92rem; max-width: 760px; margin: 16px auto; }
  </style>
</head>
<body>
  <h1>얼굴 인식 및 좌표 표시</h1>
  <p id="status">시작 버튼을 누르고 카메라 권한을 허용하세요.</p>
  <button id="start">카메라 시작</button>
  <button id="stop">카메라 종료</button>

  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <p class="note">
    표시되는 (x, y)는 카메라 영상의 왼쪽 위를 기준으로 계산한 얼굴 중심 좌표(픽셀)입니다.
    얼굴 인식 모델을 처음 불러올 때 인터넷 연결이 필요합니다.
  </p>

  <script type="module">
    import { FaceDetector, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");

    let stream = null;
    let detector = null;
    let running = false;
    let lastVideoTime = -1;

    async function startCamera() {
      try {
        status.textContent = "얼굴 인식 모델을 불러오는 중...";
        startButton.disabled = true;

        if (!detector) {
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          );
          detector = await FaceDetector.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
            },
            runningMode: "VIDEO",
            minDetectionConfidence: 0.5
          });
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        status.textContent = "얼굴을 찾는 중입니다. 종료하려면 카메라 종료를 누르세요.";
        requestAnimationFrame(detectFaces);
      } catch (error) {
        console.error(error);
        status.textContent =
          "카메라 또는 모델을 시작하지 못했습니다. 카메라 권한과 인터넷 연결을 확인하세요.";
        startButton.disabled = false;
      }
    }

    function detectFaces() {
      if (!running || !detector || video.readyState < 2) {
        if (running) requestAnimationFrame(detectFaces);
        return;
      }

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = detector.detectForVideo(video, performance.now());
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const detection of result.detections) {
          const box = detection.boundingBox;
          if (!box) continue;

          const x = box.originX;
          const y = box.originY;
          const w = box.width;
          const h = box.height;
          const centerX = Math.round(x + w / 2);
          const centerY = Math.round(y + h / 2);

          ctx.strokeStyle = "#00ff66";
          ctx.lineWidth = Math.max(2, canvas.width / 400);
          ctx.strokeRect(x, y, w, h);

          const label = `Face: (${centerX}, ${centerY})`;
          ctx.font = `bold ${Math.max(16, canvas.width / 45)}px sans-serif`;
          const textWidth = ctx.measureText(label).width;
          ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
          ctx.fillRect(8, 8, textWidth + 18, Math.max(34, canvas.width / 35));
          ctx.fillStyle = "#00ff66";
          ctx.fillText(label, 16, Math.max(30, canvas.width / 35));
        }
      }
      requestAnimationFrame(detectFaces);
    }

    function stopCamera() {
      running = false;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      status.textContent = "카메라가 종료되었습니다.";
      startButton.disabled = false;
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);
    window.addEventListener("beforeunload", stopCamera);
  </script>
</body>
</html>
